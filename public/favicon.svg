<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Brand Crimson Background matching OurLens official emblem -->
  <rect width="100" height="100" rx="22" fill="#7E0C0C" />
  
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Viewfinder / Top Bump -->
    <path d="M 37 32 Q 37 27 42 27 L 58 27 Q 63 27 63 32 L 63 36 L 37 36 Z" stroke-width="3" />
    
    <!-- Camera Body Outlines -->
    <path d="M 23 44 Q 15 44 15 52 L 15 58" stroke-width="3.2" />
    <path d="M 15 48 Q 15 37 27 37 L 37 37" stroke-width="3.2" />
    <path d="M 63 37 L 73 37 Q 85 37 85 48 L 85 58" stroke-width="3.2" />
    
    <!-- Flash window -->
    <rect x="20" y="42" width="7" height="4" rx="1.5" stroke-width="2.5" />
    
    <!-- Main Lens Outer Arc -->
    <path d="M 27 46 A 27 27 0 0 1 73 46" stroke-width="3.2" />
    <path d="M 75 66 A 27 27 0 0 1 25 66" stroke-width="3.2" />
  </g>
  
  <!-- Solid White Elements inside Lens -->
  <!-- Crescent Moon -->
  <path d="M 52 41.5 A 16.5 16.5 0 0 1 52 74.5 A 13 13 0 0 0 52 41.5 Z" fill="#FFFFFF" />
  
  <!-- Upper Sparkle Star (4-pointed) -->
  <path d="M 41.5 47 Q 41.5 52 46.5 52 Q 41.5 52 41.5 57 Q 41.5 52 36.5 52 Q 41.5 52 41.5 47 Z" fill="#FFFFFF" />
  
  <!-- Lower Sparkle Star (4-pointed, smaller) -->
  <path d="M 44.5 59.5 Q 44.5 63 48 63 Q 44.5 63 44.5 66.5 Q 44.5 63 41 63 Q 44.5 63 44.5 59.5 Z" fill="#FFFFFF" />
</svg>